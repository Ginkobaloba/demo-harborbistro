# .github/workflows/verify.yml
# Last updated: 2026-09-19
#
# BRANCH PROTECTION NOTE:
# For the deep-verify gate to actually block merges, add "deep-verify" as a
# Required status check in branch protection settings for your default branch
# (Settings > Branches > branch protection rule > "Require status checks to pass
# before merging"). Without this, the job runs but GitHub will still allow merge
# if it fails or is skipped.
#
# "Quick Verify (all PRs)" is the real PR gate: it runs npm ci, typecheck,
# lint, the unit suite, the production build, the real-server suite against
# that build, the ledger check, and the duplicate-decision-id check -- all
# against the PR's own code (2026-09-19). Before this, the job named "Quick
# Verify" only ran ledger/offline checks plus a curl against the LIVE
# deployed site, so it was structurally incapable of failing because of a
# PR's changes; a PR that broke the build or reddened every test merged
# green. See docs/decisions.md D-020 and the "Live smoke" job below.
#
# "Live smoke (deployed site)" is NOT a gate on this PR. It curls
# verify/smoke.yml's deploy_url, i.e. whatever is already running in
# production, and says nothing about the code in this PR or this branch.
# Never make it a required status check on that basis; if you want a real
# preview-environment smoke test, that is separate, larger work (standing
# up a per-PR preview deploy), not this job.
#
# WINDOWS / HEADED NOTE:
# The headed layer (Layer 5, Windows MCP / computer-use) and adversarial generation
# (--adversarial) are LOCAL deep-verify steps -- they require a real Windows desktop
# with Chrome and the computer-use MCP running. They cannot run in CI. CI covers
# layers 1-4 and curated edge cases only. The human-gated local run covers layers 5-6.
# Default to ubuntu-latest for network and headless layers.

name: Paradigm Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  quick-verify:
    name: Quick Verify (all PRs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@paradigm-codes'

      # NODE_AUTH_TOKEN is read by the .npmrc actions/setup-node just wrote
      # to the user config (registry-url + scope above); npm interpolates it
      # itself. The token is never echoed, never written by a step of ours,
      # and never appears on a command line.
      - name: Install dependencies (npm ci)
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

      - name: Check ledger
        run: npm run ledger:check

      - name: Check docs/decisions.md for duplicate decision ids
        run: node scripts/check-decisions.mjs docs/decisions.md

      - name: Typecheck
        run: npx tsc --noEmit --extendedDiagnostics

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Seed the database (build reads it; mirrors the Dockerfile)
        run: |
          npm run db:seed
          npm run db:verify

      - name: Build
        run: npm run build

      # Needs the build directly above: test:server starts the standalone
      # server that build produced and refuses to run if the build stamp
      # (.next/BUILD_STAMP.json, written by postbuild) does not match the
      # current checkout (D-020, test/server/fresh-build.ts). Running this
      # any earlier, or against a cached/stale build, would defeat that
      # check by construction.
      - name: Real-server suite (post-build)
        run: npm run test:server

      - name: Test the deep-verify gate (offline)
        run: bash verify/ci/test_deep_gate.sh

  live-smoke:
    name: Live smoke (deployed site)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      # This hits verify/smoke.yml's deploy_url -- the LIVE deployed site,
      # not this PR's code. It cannot fail because of anything in this PR.
      - name: Run smoke against verify/smoke.yml (production, not this PR)
        run: bash verify/ci/quick_smoke.sh verify/smoke.yml

  deep-verify:
    name: Deep Verify (tier-3 PRs only)
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'tier-3')
    needs: quick-verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The report must name THIS PR (pr<N> in the file name) and record the
      # commit it tested (Tested-SHA), and nothing but reports may have changed
      # since that commit. A PASS report from another PR no longer counts.
      - name: Require a committed deep-verify report for this PR and this code
        run: >-
          bash verify/ci/deep_gate.sh
          "${{ github.event.pull_request.number }}"
          "${{ github.event.pull_request.head.sha }}"
